name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    # The newest toolchain, so that the swift-format on CI is the one used to format locally.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Lint
        run: swift format lint --strict --recursive .

  build-macos:
    name: Swift ${{ matrix.swift }} on Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported toolchain: swift-tools-version 6.0, and Xcode 16.0 in the Homebrew formula.
          - swift: "6.0"
            xcode: "16.0"
            runs-on: macos-15
          - swift: "6.1"
            xcode: "16.4"
            runs-on: macos-15
          - swift: "6.2"
            xcode: "26.0"
            runs-on: macos-26
          - swift: "6.3"
            xcode: "26.6"
            runs-on: macos-26
          # Homebrew builds the macOS 27 bottle with this toolchain.
          - swift: "6.4"
            xcode: "27.0"
            runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # The key names the toolchain: a .build directory from another compiler does not build.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.xcode }}-spm-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}-jammy
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Homebrew builds the Linux bottles with the newest one.
        swift: ["6.0", "6.1", "6.2", "6.3", "6.4"]
    steps:
      - uses: actions/checkout@v7

      # The key names the toolchain: a .build directory from another compiler does not build.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  # TEMPORARY: checks the release build on the new toolchains. Remove before merge.
  release-dry-run:
    name: Release build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            arch: arm64
            build-path: arm64-apple-macosx/release
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64
            build-path: x86_64-unknown-linux-gnu/release
            container: swift:6.4-jammy
            extra-flags: --static-swift-stdlib -Xlinker -lstdc++ -Xlinker -L/usr/lib/swift/linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: apt-get update && apt-get install -y curl build-essential

      - uses: actions/checkout@v7

      - name: Select Xcode 26.6 (macOS)
        if: matrix.platform == 'macos-arm64'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }} ${{ matrix.extra-flags }}

      - name: Run release binary
        run: |
          .build/${{ matrix.build-path }}/xcsift --version
          echo '** BUILD SUCCEEDED **' | .build/${{ matrix.build-path }}/xcsift -f toon
          file .build/${{ matrix.build-path }}/xcsift || true
          ldd .build/${{ matrix.build-path }}/xcsift || otool -L .build/${{ matrix.build-path }}/xcsift || true
