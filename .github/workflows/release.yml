name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            arch: arm64
            build-path: arm64-apple-macosx/release
            toolchain: xcode-26.6
          # jammy, for the oldest glibc: the binary then runs on more distributions.
          # Not 6.4: its static Foundation libraries do not pull in their dependencies (CoreFoundation,
          # _FoundationCollections, Synchronization), so --static-swift-stdlib does not link.
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64
            build-path: x86_64-unknown-linux-gnu/release
            container: swift:6.3-jammy
            toolchain: swift-6.3-jammy
            extra-flags: --static-swift-stdlib -Xlinker -lstdc++ -Xlinker -L/usr/lib/swift/linux

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: apt-get update && apt-get install -y curl build-essential

      - uses: actions/checkout@v7

      # The key names the toolchain: a .build directory from another compiler does not build.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-release-${{ matrix.toolchain }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.toolchain }}-spm-

      - name: Select Xcode 26.6 (macOS)
        if: matrix.platform == 'macos-arm64'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Replace version placeholder
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" Sources/xcsift/main.swift
          else
            sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" Sources/xcsift/main.swift
          fi

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }} ${{ matrix.extra-flags }}

      - name: Create release archive
        run: |
          tar -czf xcsift-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz \
            -C .build/${{ matrix.build-path }} xcsift

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xcsift-${{ matrix.platform }}
          path: xcsift-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*/xcsift-*.tar.gz
          generate_release_notes: true

  # Signs a packslip release manifest (packslip.sigstore.json) for the published archives.
  # Consumers such as mise's packslip: backend pin the signer to this file's path,
  # .github/workflows/release.yml: keep signing in this file, keep attest: true, and give
  # id-token: write to no other job. Any action in this job can sign as this workflow,
  # so each one is pinned to a full commit SHA.
  packslip:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read       # Download the release assets and read the skill path.
      id-token: write      # Sign with this workflow's identity.
      attestations: write  # Attest the archives' build provenance.
    steps:
      # The archives as published, so the signed digests are the bytes users download.
      # Each is named: an asset that release.toml does not describe must not be signed.
      - name: Download the published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "xcsift-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            --pattern "xcsift-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          ls -l dist
          test "$(find dist -type f | wc -l)" -eq 2

      # packslip create records repo: paths without reading them.
      - name: Check the skill at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/contents/skills/xcsift/SKILL.md?ref=${GITHUB_SHA}" --silent

      # glibc_min and os_min can be set only per artifact, in TOML; packslip reads libs from the binaries.
      # glibc_min: the swift:6.3-jammy build container (glibc 2.35). os_min: .macOS(.v13) in Package.swift.
      - name: Write release.toml
        run: |
          cat > release.toml <<EOF
          [[artifact]]
          path = "dist/xcsift-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          requires = { glibc_min = "2.35" }

          [[artifact]]
          path = "dist/xcsift-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          requires = { os_min = "13" }
          EOF
          cat release.toml

      - name: Sign the packslip
        id: packslip
        uses: jdx/packslip@0e9bde4ea49070555a79cac1f040f1dafe60acd6 # v1.8.0
        with:
          artifacts: dist/xcsift-*.tar.gz
          manifest: release.toml
          bin: xcsift
          resources: |
            skill/xcsift=repo:skills/xcsift
          attest: true
          upload: false

      - name: Show the signed statement
        env:
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: packslip show "$BUNDLE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 1

  publish-packslip:
    needs: packslip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # Upload the bundle to the release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
